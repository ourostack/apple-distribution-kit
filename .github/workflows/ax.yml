name: Ouro AX X-ray

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the made-up App Store Connect mock on loopback
        run: |
          node scripts/xray-mock.mjs 4010 > "$RUNNER_TEMP/mock.log" 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4010/__mock && break; sleep 0.2; done
      - name: Ouro AX X-ray
        env:
          MOCK_URL: http://127.0.0.1:4010
        run: |
          mkdir -p xray "$RUNNER_TEMP/xray-home"
          node scripts/inventory.mjs > inventory.json
          node src/ouro-ax/xray.ts --cli "node dist/cli.js" --name apple-distribution-kit --inventory inventory.json \
            --home "$RUNNER_TEMP/xray-home" --env "APPLE_DISTRIBUTION_ASC_BASE_URL=$MOCK_URL" \
            --guard "node scripts/assert-mock.mjs" --state "manifest validate" \
            --commit "$GITHUB_SHA" --json --md xray/xray.md > xray/report.json
          node -e "const s = require('./xray/report.json').summary; if (!s) process.exit(1); if (s.mustHolding !== s.must) { console.error('X-ray: ' + s.mustHolding + ' of ' + s.must + ' must claims hold; see xray/xray.md in the artifact'); process.exit(1); }"
      - name: Action claims
        run: |
          mkdir -p xray-actions
          node tools/ouro-actions/ouro-actions.mts check actions/apple-distribution-kit.actions.mts actions/generated \
            --report xray-actions/report.json --app "Apple distribution kit" --commit "$GITHUB_SHA"
          node -e "const s = require('./xray-actions/report.json').summary; if (!s) process.exit(1); if (s.mustHolding !== s.must) { console.error('Action claims: ' + s.mustHolding + ' of ' + s.must + ' must claims hold'); process.exit(1); }"
      - name: Upload the X-ray
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray
          path: xray/
      - name: Upload the action claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-xray
          path: xray-actions/
